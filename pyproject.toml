[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "session-timeline"
version = "0.1.0"
description = "Reconstruct and visualize where time went in AI-agent sessions (inference vs tools vs waiting-for-user) from existing harness artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
session-timeline = "session_timeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
session_timeline = ["web/app_shell.html"]
