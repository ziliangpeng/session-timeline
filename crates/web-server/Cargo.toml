[package]
name = "web-server"
version = "0.1.0"
edition = "2021"

[dependencies]
data-read = { path = "../data-read" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2.189"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tower = { version = "0.5", features = ["util"] }
